body:
  text: 易學辨惑易類提要臣等謹案易學辨惑一卷宋邵伯溫撰伯溫字子文邵子之子也南渡後官至利路轉運副使事蹟具宋史儒林傳按沈括夢溪筆談載江南鄭夬字揚庭曽為一書談易後見兵部員外郎秦玠論夬所談玠駭然曰何處得此法嘗遇一異人授此歷數推往古興衰運歷無不皆驗西都邵雍亦知大略云云蓋當時以邵子能前知故引之以重其術伯溫謂邵子易受之李之才之才受之穆修修受之陳摶平時未嘗妄以語人惟大名王天悅滎陽張子望嘗從學又皆蚤死秦玠鄭夬嘗欲從學皆不之許天悅感疾且卒夬賂其僕於卧內竊得之遂以為學著易傳易測明範五經明用數書皆破碎妄作穿鑿不根因撰此書以辨之宋史邵子本傳頗採其說考書録解題有鄭夬易傳十三卷宋史藝文志有鄭夬時用書二十卷明用書九卷易傳詞三卷易傳詞後語一卷今並佚司馬光集有進鄭夬易測劄子稱其不泥隂陽不涉怪妄専用人事指明六爻求之等倫誠難多得與伯溫所辨褒貶迥殊光亦知易之人不應背馳如是以理推之夬竊邵子之書而變化其說以隂求駕乎其上所撰易測必尚隨爻演義不涉術數故光有不泥隂陽不涉怪妄之薦至其時用書之類則純言占卜之法故伯溫辭而闢之其兼易測言之者不過憎及儲胥之意耳朱彛尊經義考載此書注曰未見此本自永樂大典録出蓋明初猶存宋史藝文志但題辨惑一卷無易學字永樂大典則有之與書録解題相合故今仍以易學辨惑著録焉乾隆四十六年九月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀
